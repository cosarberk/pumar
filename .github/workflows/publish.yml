name: Publish image

# main'e her push/merge'de: sürümü OTOMATİK bump eder (git tag),
# Helm chart version'ını VE values.yaml image tag'ini yeni sürüme eşitleyip
# push eder (Rancher "Upgrade" ile görünür; upgrade edince kesin yeni image
# iner), ve image'ı GitHub Container Registry'ye (ghcr.io) yayınlar.
# Harici secret gerekmez: yerleşik GITHUB_TOKEN yeterli.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }} # cosarberk/pumar

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # git tag + chart/values version push için
      packages: write # GHCR push için
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Sürümü otomatik artır ve git tag'i at (patch varsayılan;
      # commit mesajında #minor / #major ile kontrol). İlk sürüm 0.1.0'dan başlar.
      - name: Bump version & tag
        id: tag
        uses: anothrNick/github-tag-action@1.71.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: patch
          WITH_V: true
          INITIAL_VERSION: 0.1.0
          RELEASE_BRANCHES: main

      # Helm chart version'ını + values image tag'ini yeni sürüme eşitle ve push et
      # ([skip ci] ile bu push tekrar publish tetiklemez → sonsuz döngü yok).
      - name: Bump Helm chart & values
        run: |
          TAG="${{ steps.tag.outputs.new_tag }}"   # vX.Y.Z
          VER="${TAG#v}"                            # X.Y.Z
          sed -i "s/^version:.*/version: ${VER}/" deploy/helm/pumar/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: '${TAG}'/" deploy/helm/pumar/Chart.yaml
          sed -i "s|^  tag:.*|  tag: ${TAG}|" deploy/helm/pumar/values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): ${TAG} [skip ci]"
          git push origin HEAD:main

      - uses: docker/setup-buildx-action@v3

      - name: GHCR login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.tag.outputs.new_tag }}
            type=sha,format=long

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
