{{- if .Values.admin.password }}
# İlk admin kimliği — API açılışta okur, yalnızca users tablosu boşken kullanır.
apiVersion: v1
kind: Secret
metadata:
  name: pumar-admin
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  ADMIN_EMAIL: {{ .Values.admin.email | quote }}
  ADMIN_PASSWORD: {{ .Values.admin.password | quote }}
  ADMIN_NAME: {{ .Values.admin.name | quote }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pumar
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.server.replicas }}
  selector:
    matchLabels:
      app: pumar
  template:
    metadata:
      labels:
        app: pumar
    spec:
      # API başlamadan önce şemayı uygula. migrate.ts idempotenttir
      # (schema_migrations izler); Postgres hazır değilse initContainer
      # başarısız olur ve k8s pod'u yeniden dener.
      initContainers:
        - name: db-migrate
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ['npx', 'tsx', 'infra/migrate.ts']
          env:
            - name: DATABASE_URL
              value: postgres://{{ .Values.postgres.user }}:{{ .Values.postgres.password }}@postgres:5432/{{ .Values.postgres.db }}
      containers:
        - name: pumar
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.server.port }}
          env:
            - name: API_PORT
              value: {{ .Values.server.port | quote }}
            - name: DATABASE_URL
              value: postgres://{{ .Values.postgres.user }}:{{ .Values.postgres.password }}@postgres:5432/{{ .Values.postgres.db }}
            # Jira/GitLab kimlikleri ENV'den verilmez; Pumar → "Ayarlar"
            # ekranından DB'ye girilir (DB > env önceliği).
          {{- if .Values.admin.password }}
          # İlk admin bootstrap'i — Secret'tan ADMIN_EMAIL/PASSWORD/NAME.
          envFrom:
            - secretRef:
                name: pumar-admin
          {{- end }}
          resources: {{- toYaml .Values.server.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.server.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.server.port }}
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: pumar
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: pumar
  ports:
    - port: {{ .Values.server.port }}
      targetPort: {{ .Values.server.port }}
