services:
  postgres:
    image: postgres:16-alpine
    container_name: pumar-postgres
    environment:
      POSTGRES_USER: pumar
      POSTGRES_PASSWORD: pumar
      POSTGRES_DB: pumar
    ports:
      - "5434:5432"
    volumes:
      - pumar_pg:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pumar"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pumar-redis
    ports:
      - "6380:6379"
    volumes:
      - pumar_redis:/data

volumes:
  pumar_pg:
  pumar_redis:
